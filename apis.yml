features:
  - name: Indonesian Superapp Ecosystem
    description: Gojek superapp covers ride hailing, food delivery, parcel logistics, and bills payment in Indonesia and select SEA markets.
  - name: GoTo Financial Stack
    description: GoPay e-money, Midtrans PSP, and Moka POS together provide consumer wallet, merchant gateway, and SMB point-of-sale.
  - name: Tokopedia Marketplace
    description: Tokopedia (now operated jointly with TikTok Shop) is one of Indonesia's largest C2C and B2C marketplaces.
  - name: Mitra Network
    description: Mitra Tokopedia and Mitra GoPay turn neighbourhood warungs into digital-product and bill-payment kiosks.
useCases:
  - name: Indonesian E-commerce Logistics
    description: Sellers use GoSend for instant and same-day Jakarta-area deliveries.
  - name: Merchant Payment Acceptance
    description: Indonesian merchants accept cards, bank transfer, e-wallets, and QRIS through Midtrans.
  - name: Restaurant POS Integration
    description: GoFood restaurants integrate POS systems through GoBiz to manage menus and orders.
  - name: Marketplace Selling
    description: Sellers list and fulfill across Tokopedia + TikTok Shop using the TikTok Shop Open Platform.
integrations:
  - name: TikTok Shop
  - name: Bank Mandiri
  - name: Bank BCA
  - name: Bank BNI
  - name: Bank Permata
  - name: Visa
  - name: Mastercard
  - name: ShopeePay
  - name: OVO
  - name: DANA
authentication:
  - type: OAuth2
    description: Partner integrations (TikTok Shop Open Platform, GoBiz) use OAuth 2.0 authorization-code flow with partner-issued credentials.
  - type: APIKey
    description: Midtrans and Moka APIs authenticate with server-side API keys per merchant account.
  - type: HMACSignature
    description: Payment APIs sign requests with HMAC over a shared merchant secret.
